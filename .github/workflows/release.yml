name: Release VSIX

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can verify the tag is on main

      - name: Ensure tag is merged into main
        run: |
          git fetch origin main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag commit $GITHUB_SHA is on main — proceeding with release."
          else
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Release skipped until the PR is merged."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify committed versions match the tag
        run: node scripts/check-versions.mjs --expect "${GITHUB_REF_NAME#v}"

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Build and package VSIX
        working-directory: vscode-extension
        run: npm run package

      - name: Create GitHub release with the VSIX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            vscode-extension/*.vsix \
            --title "${{ github.ref_name }}" \
            --generate-notes
